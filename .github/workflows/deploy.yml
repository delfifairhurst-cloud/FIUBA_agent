name: Deploy Firebase Hosting (Render deploys automatically)

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'firebase.json'
  workflow_dispatch:

jobs:
  deploy-frontend:
    name: Deploy Frontend to Firebase Hosting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy to Firebase Hosting
        run: |
          firebase deploy --only hosting --project agente-fiuba --token "${{ secrets.FIREBASE_TOKEN }}"
