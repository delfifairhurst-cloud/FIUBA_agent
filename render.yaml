# Canonical service: srv-da85p52fngtc73bg658g. Do not create a second service.
services:
  - type: web
    name: fiuba-agent-backend_1
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
        sync: false
